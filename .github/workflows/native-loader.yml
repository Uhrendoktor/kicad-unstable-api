name: Native loader prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_editor_validation:
        description: Build both pinned KiCad editors and run the real Eeschema/PCB Editor smoke tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-loader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-loader:
    name: ${{ matrix.os }} KIFACE proxy harness
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify KIFACE vtable order against pinned KiCad source
        run: python tools/verify_kiface_abi.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test native proxy and extension lifecycle
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test installer transaction
        run: python -m unittest discover -s tests -p "test_*.py" -v

  # This cold, full-source editor build costs roughly 80-110 Linux runner
  # minutes. Keep exact-build runtime validation available, but never run it
  # automatically on every PR or push.
  real-kicad-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.full_editor_validation
    name: Pinned KiCad production build and live-editor smoke (manual opt-in)
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git gettext pkg-config glslang-tools \
            libbz2-dev libcairo2-dev libglu1-mesa-dev libgl1-mesa-dev \
            libglew-dev libx11-dev libwxgtk3.2-dev libwxgtk-webview3.2-dev \
            mesa-common-dev python3-dev python3-wxgtk4.0 libboost-all-dev \
            libglm-dev libcurl4-openssl-dev libgtk-3-dev libngspice0-dev \
            ngspice-dev libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-data-exchange-dev libocct-visualization-dev \
            libocct-foundation-dev libocct-ocaf-dev unixodbc-dev zlib1g-dev \
            shared-mime-info libgit2-dev libsecret-1-dev libnng-dev \
            libprotobuf-dev protobuf-compiler swig python3-pip python3-venv \
            libzstd-dev libspnav-dev libpoppler-glib-dev libsqlite3-dev xvfb xauth strace
      - name: Fetch pinned KiCad source
        run: |
          git init /tmp/kicad-source
          git -C /tmp/kicad-source remote add origin https://github.com/KiCad/kicad-source-mirror.git
          git -C /tmp/kicad-source fetch --depth=1 origin b7066f886375b186ca8fa469de3a6382f6bba400
          git -C /tmp/kicad-source checkout --detach FETCH_HEAD
      - name: Configure matching KiCad build tree
        run: |
          cmake -S /tmp/kicad-source -B /tmp/kicad-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DKICAD_USE_CMAKE_FINDPROTOBUF=ON \
            -DKICAD_USE_PCH=OFF \
            -DKICAD_SCRIPTING_WXPYTHON=OFF \
            -DKICAD_BUILD_QA_TESTS=OFF \
            -DKICAD_BUILD_I18N=OFF
      - name: Build KiCad GAL shared library for proxy runtime dependency
        run: cmake --build /tmp/kicad-build --parallel 2 --target gal
      - name: Compile both production KIFACE proxies against KiCad headers and GAL
        run: |
          python3 tools/build_real_kicad_proxy.py \
            --kicad-source /tmp/kicad-source \
            --kicad-build /tmp/kicad-build \
            --output-dir build/real-kicad
      - name: Build matching Eeschema and PCB Editor binaries
        run: cmake --build /tmp/kicad-build --parallel 2 --target eeschema pcbnew
      - name: Build live-editor GAL smoke extension
        run: |
          cmake -S . -B build/smoke-extension -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DKUA_SMOKE_WITH_WX=ON
          cmake --build build/smoke-extension --target kua_real_smoke_extension --parallel
      - name: Run real Eeschema and PCB Editor GAL smoke test
        env:
          KUA_SMOKE_LD_DEBUG: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 tools/smoke_real_kicad.py \
            --eeschema-install-dir /tmp/kicad-build/eeschema \
            --pcbnew-install-dir /tmp/kicad-build/pcbnew \
            --proxy-dir build/real-kicad \
            --smoke-extension build/smoke-extension/kua_real_smoke_extension.so \
            --eeschema /tmp/kicad-build/eeschema/eeschema \
            --pcbnew /tmp/kicad-build/pcbnew/pcbnew \
            --diagnostics-dir build/real-kicad-diagnostics \
            --timeout 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-kicad-linux-proxies-and-diagnostics
          path: |
            build/real-kicad/_eeschema.kiface
            build/real-kicad/_pcbnew.kiface
            build/smoke-extension/kua_real_smoke_extension.so
            build/real-kicad-diagnostics/
          if-no-files-found: warn
          retention-days: 7
